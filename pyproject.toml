# Package specification, as defined here:
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#pyproject-toml-spec

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[project]
name = "think-overflow"
readme = "README.md"
version = "0.dev0"
authors = [{ name = "Lukas Twist", email = "itsluketwist@gmail.com" }]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = "==3.11.6"
# pinned to the versions used for the reported experiments, uv.lock pins the rest
dependencies = [
    "bigcodebench==0.2.5",
    "datasets==4.8.4",
    "Jupyter==1.1.1",
    "llm-codegen-research==2.11",
    "math-verify==0.9.0",
    "pre-commit",
    "pytest",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "setuptools==65.5.0",
    "thinkpack==0.2.4",
    "torch==2.10.0",
    "tqdm==4.67.3",
    # vllm does not support transformers 5.x
    "transformers==4.57.6",
    "types-PyYAML",
    "uv==0.11.7",
    "vllm==0.19.0",
]

[project.scripts]
run = "src.cli:main"

[tool.uv]
# vllm and the cuda torch wheels are linux-only, so resolve the lock for linux alone
environments = ["sys_platform == 'linux'"]
