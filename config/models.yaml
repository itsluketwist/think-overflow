# model config - paths and optional per-model settings
# defaults: recommended sampling params from the model card, used when the inference
# config profile sets temperature/top_p/top_k to null (i.e. the "default" profile)

# --- Qwen3 models (Alibaba, Apache 2.0) ---
# context: 40,960 | generation: 32,768 (recommended)
# source: https://huggingface.co/Qwen/Qwen3-8B

qwen3-0b:  # for debug test runs, not experiments
  model_path: "Qwen/Qwen3-0.6B"
  defaults:
    temperature: 0.6
    top_p: 0.95
    top_k: 20

qwen3-8b:
  model_path: "Qwen/Qwen3-8B"
  defaults:
    temperature: 0.6
    top_p: 0.95
    top_k: 20

qwen3-14b:
  model_path: "Qwen/Qwen3-14B"
  defaults:
    temperature: 0.6
    top_p: 0.95
    top_k: 20

qwen3-32b:
  model_path: "Qwen/Qwen3-32B"
  defaults:
    temperature: 0.6
    top_p: 0.95
    top_k: 20


# --- OpenReasoning-Nemotron models (Nvidia, CC-BY-4.0) ---
# context: 131,072 | generation: 64,000 (recommended)
# source: https://huggingface.co/nvidia/OpenReasoning-Nemotron-7B

or-7b:
  model_path: "nvidia/OpenReasoning-Nemotron-7B"
  defaults:
    temperature: 0.6
    top_p: 0.95
    top_k: -1


# --- OpenCodeReasoning-Nemotron models (Nvidia, CC-BY-4.0) ---
# context: 65,536 | generation: 49,152 (recommended)
# source: https://huggingface.co/nvidia/OpenCodeReasoning-Nemotron-1.1-7B

ocr-7b:
  model_path: "nvidia/OpenCodeReasoning-Nemotron-1.1-7B"
  defaults:
    temperature: 0.6
    top_p: 0.95
    top_k: -1


# --- OLMo thinking models (AllenAI, Apache 2.0) ---
# context: 65,536 | generation: 32,768 (recommended)
# source: https://huggingface.co/allenai/OLMo-3-7B-Think

olmo-3-7b:
  model_path: "allenai/OLMo-3-7B-Think"
  defaults:
    temperature: 0.6
    top_p: 0.95
    top_k: -1


# --- DeepSeek R1 distilled models (DeepSeek, MIT License) ---
# context: 131,072 | generation: 32,768 (recommended)
# source: https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Llama-8B

llama-r1-8b:
  model_path: "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"
  defaults:
    temperature: 0.6
    top_p: 0.95
    top_k: -1
