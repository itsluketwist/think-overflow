# model config - paths and optional per-model settings
# defaults: recommended sampling params from the model card, used when the inference
# config profile sets temperature/top_p/top_k to null (i.e. the "default" profile)

# --- Qwen3 models (Alibaba, Apache 2.0) ---

qwen3-0b:  # for debug test runs, not experiments
  model_path: "Qwen/Qwen3-0.6B"
  defaults:
    temperature: 0.6
    top_p: 0.95
    top_k: 20

qwen3-8b:
  model_path: "Qwen/Qwen3-8B"
  defaults:
    temperature: 0.6
    top_p: 0.95
    top_k: 20

qwen3-14b:
  model_path: "Qwen/Qwen3-14B"
  defaults:
    temperature: 0.6
    top_p: 0.95
    top_k: 20


# --- Qwen3.5 models (Alibaba, Apache 2.0) ---

qwen3.5-9b:
  model_path: "Qwen/Qwen3.5-9B"
  defaults:
    temperature: 0.6
    top_p: 0.85
    top_k: 20


